# Publica el sitio en el hosting por FTP/SFTP cada vez que se ejecuta.
#
# Configuración (una sola vez), en GitHub → Settings → Secrets and variables → Actions:
#   FTP_SERVER    → servidor (ej. ftp.legem.mx) — lo proporciona el hosting
#   FTP_USERNAME  → usuario FTP
#   FTP_PASSWORD  → contraseña FTP
#   FTP_DIR       → carpeta del sitio en el servidor (ej. /public_html/)
#
# Se publica solo con cada cambio que llegue a la rama main (merge de un pull request o push).
# También se puede ejecutar a mano: pestaña "Actions" → "Publicar sitio" → "Run workflow".
# El destino lo define el secreto FTP_DIR (carpeta de prueba o /public_html/ en producción).

name: Publicar sitio

on:
  workflow_dispatch:
  push:
    branches: [main]
    # No publicar si solo cambian archivos que no forman parte del sitio.
    paths-ignore:
      - 'Claude outputs/**'
      - 'extras/**'
      - 'fuentes/**'
      - '**/*.md'

# Si llegan dos cambios seguidos, el segundo espera a que termine el primero.
concurrency:
  group: publicar-sitio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Subir archivos al hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: ./dist/
          # protocol: ftps   # usar si el hosting lo soporta
